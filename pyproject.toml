[project]
name = "taofi-analyzer"
version = "2.1.0"
description = "A Dash-based web application for analyzing fault injection experiment databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=3.1.1",
    "dash-ag-grid>=31.3.1",
    "dash-bootstrap-components>=2.0.3",
    "gunicorn>=23.0.0",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
]

[dependency-groups]
browser = [
    "playwright>=1.63.0",
]
dev = [
    "basedpyright>=1.29.5",
    "pytest>=9.1.1",
    "ruff>=0.12.2",
]

[tool.setuptools]
# only the analyzer is Python code (pages/, assets/ and databases/ are data)
packages = ["analyzer", "analyzer.graphs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# the browser tests need the "browser" dependency group and Chrome/Chromium:
#   uv sync --group browser && uv run pytest -m browser
addopts = "-m 'not browser'"
markers = ["browser: drives the app in a real (headless) browser"]
