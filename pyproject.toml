[project]
name = "taofi-analyzer"
version = "2.1.0"
description = "A Dash-based web application for analyzing fault injection experiment databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=3.1.1",
    "dash-ag-grid>=31.3.1",
    "dash-bootstrap-components>=2.0.3",
    "gunicorn>=23.0.0",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
]

[dependency-groups]
dev = ["basedpyright>=1.29.5", "ruff>=0.12.2"]

[tool.setuptools]
# only the analyzer is Python code (pages/, assets/ and databases/ are data)
packages = ["analyzer", "analyzer.graphs"]
